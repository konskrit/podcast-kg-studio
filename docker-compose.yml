# Optional web/ops path. Native Windows can run Postgres + Oxigraph as local services instead.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pkg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pkg}
      POSTGRES_DB: ${POSTGRES_DB:-podcast_kg_studio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pkg} -d ${POSTGRES_DB:-podcast_kg_studio}"]
      interval: 5s
      timeout: 5s
      retries: 12

  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:latest
    restart: unless-stopped
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]
    ports:
      - "127.0.0.1:${OXIGRAPH_PORT:-7878}:7878"
    volumes:
      - ./data/oxigraph:/data
